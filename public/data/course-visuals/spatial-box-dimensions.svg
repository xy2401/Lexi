  </defs>
  <path d="M75 110 L135 60 H290 L230 110 Z" fill="#edf3f7" stroke="#a9bac8" stroke-width="2" />
  <path d="M230 110 L290 60 V175 L230 225 Z" fill="#dce8f0" stroke="#a9bac8" stroke-width="2" />
  <rect x="75" y="110" width="155" height="115" class="object" fill="#e8f0f5" stroke="#a9bac8" stroke-width="2" />
