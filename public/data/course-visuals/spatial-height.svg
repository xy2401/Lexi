  <line x1="230" y1="125" x2="230" y2="48" class="measure-line" stroke="#8193a5" stroke-width="1.5" marker-end="url(#gray-arrow)" />
  <line x1="250" y1="125" x2="250" y2="202" class="measure-line" stroke="#8193a5" stroke-width="1.5" marker-end="url(#gray-arrow)" />
  </svg>
