<svg xmlns="http://www.w3.org/2000/svg" width="360" height="250" font-family="system-ui, sans-serif" fill="#314d62" text-anchor="middle" viewBox="0 0 360 250" role="img" aria-label="球在盒子上方是 above，在盒子下方是 below">
  <defs>
    <marker id="gray-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8193a5" /></marker>
  </defs>
  <path d="M180 38 V210" class="guide" fill="none" stroke="#c9d7e1" stroke-width="1.5" stroke-dasharray="4 5" />
  <rect x="135" y="95" width="90" height="60" rx="8" class="object" fill="#e8f0f5" stroke="#a9bac8" stroke-width="2" />
  <text x="180" y="129" class="label" font-size="17" font-weight="600">box</text>
  <circle cx="180" cy="45" r="13" class="accent-fill" fill="#2585bd" /><circle cx="180" cy="205" r="13" class="accent-fill" fill="#2585bd" />
